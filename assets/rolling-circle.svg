<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="space" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0B1030"/>
      <stop offset="55%" stop-color="#05061A"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="nebula1" cx="30%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#5B2CFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5B2CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="75%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7DF9FF" stop-opacity="1"/>
      <stop offset="35%" stop-color="#1F51FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1F51FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="120" y1="34" x2="187.4" y2="65.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DF9FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7DF9FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="core" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="frame">
      <circle cx="120" cy="120" r="118"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- deep space backdrop -->
    <circle cx="120" cy="120" r="118" fill="url(#space)"/>
    <circle cx="120" cy="120" r="118" fill="url(#nebula1)"/>
    <circle cx="120" cy="120" r="118" fill="url(#nebula2)"/>

    <!-- starfield -->
    <circle cx="151.8" cy="11.7" r="0.86" fill="#EAF6FF"><animate attributeName="opacity" values="0.29;1;0.29" dur="2.17s" begin="2.21s" repeatCount="indefinite"/></circle>
    <circle cx="209.4" cy="25.8" r="1.05" fill="#EAF6FF"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.59s" begin="0.66s" repeatCount="indefinite"/></circle>
    <circle cx="12.1" cy="51.3" r="1.34" fill="#EAF6FF"><animate attributeName="opacity" values="0.27;1;0.27" dur="3.13s" begin="0.66s" repeatCount="indefinite"/></circle>
    <circle cx="190.6" cy="7.5" r="1.55" fill="#EAF6FF"><animate attributeName="opacity" values="0.18;1;0.18" dur="3.59s" begin="1.02s" repeatCount="indefinite"/></circle>
    <circle cx="224.2" cy="82.7" r="0.62" fill="#EAF6FF"><animate attributeName="opacity" values="0.27;1;0.27" dur="1.79s" begin="2.54s" repeatCount="indefinite"/></circle>
    <circle cx="128.3" cy="227.9" r="0.99" fill="#EAF6FF"><animate attributeName="opacity" values="0.27;1;0.27" dur="3.16s" begin="2.49s" repeatCount="indefinite"/></circle>
    <circle cx="166.6" cy="16.4" r="0.8" fill="#EAF6FF"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.37s" begin="0.24s" repeatCount="indefinite"/></circle>
    <circle cx="29.0" cy="69.4" r="1.33" fill="#EAF6FF"><animate attributeName="opacity" values="0.19;1;0.19" dur="2.59s" begin="1.11s" repeatCount="indefinite"/></circle>
    <circle cx="66.9" cy="219.6" r="1.34" fill="#EAF6FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.33s" begin="0.51s" repeatCount="indefinite"/></circle>
    <circle cx="231.6" cy="151.9" r="1.22" fill="#EAF6FF"><animate attributeName="opacity" values="0.31;1;0.31" dur="3.55s" begin="2.53s" repeatCount="indefinite"/></circle>
    <circle cx="58.2" cy="13.3" r="0.91" fill="#EAF6FF"><animate attributeName="opacity" values="0.34;1;0.34" dur="2.3s" begin="0.63s" repeatCount="indefinite"/></circle>
    <circle cx="205.8" cy="77.7" r="1.35" fill="#EAF6FF"><animate attributeName="opacity" values="0.24;1;0.24" dur="2.69s" begin="2.74s" repeatCount="indefinite"/></circle>
    <circle cx="233.4" cy="122.2" r="0.62" fill="#EAF6FF"><animate attributeName="opacity" values="0.28;1;0.28" dur="1.64s" begin="0.33s" repeatCount="indefinite"/></circle>
    <circle cx="20.5" cy="93.0" r="1.79" fill="#EAF6FF"><animate attributeName="opacity" values="0.32;1;0.32" dur="3.09s" begin="2.91s" repeatCount="indefinite"/></circle>
    <circle cx="8.6" cy="170.3" r="1.39" fill="#EAF6FF"><animate attributeName="opacity" values="0.28;1;0.28" dur="3.11s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="109.4" cy="223.5" r="1.64" fill="#EAF6FF"><animate attributeName="opacity" values="0.19;1;0.19" dur="2.29s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="214.1" cy="204.5" r="0.89" fill="#EAF6FF"><animate attributeName="opacity" values="0.18;1;0.18" dur="3.42s" begin="1.83s" repeatCount="indefinite"/></circle>
    <circle cx="6.1" cy="79.9" r="0.53" fill="#EAF6FF"><animate attributeName="opacity" values="0.32;1;0.32" dur="4.29s" begin="2.64s" repeatCount="indefinite"/></circle>
    <circle cx="76.1" cy="19.2" r="1.64" fill="#EAF6FF"><animate attributeName="opacity" values="0.25;1;0.25" dur="4.34s" begin="0.26s" repeatCount="indefinite"/></circle>
    <circle cx="21.8" cy="179.4" r="1.5" fill="#EAF6FF"><animate attributeName="opacity" values="0.26;1;0.26" dur="1.89s" begin="1.43s" repeatCount="indefinite"/></circle>
    <circle cx="66.4" cy="204.9" r="1.05" fill="#EAF6FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.14s" begin="1.62s" repeatCount="indefinite"/></circle>
    <circle cx="232.9" cy="154.2" r="1.07" fill="#EAF6FF"><animate attributeName="opacity" values="0.19;1;0.19" dur="3.05s" begin="0.36s" repeatCount="indefinite"/></circle>
    <circle cx="22.2" cy="149.9" r="0.8" fill="#EAF6FF"><animate attributeName="opacity" values="0.16;1;0.16" dur="4.22s" begin="2.58s" repeatCount="indefinite"/></circle>
    <circle cx="54.8" cy="36.2" r="1.72" fill="#EAF6FF"><animate attributeName="opacity" values="0.31;1;0.31" dur="3.21s" begin="1.42s" repeatCount="indefinite"/></circle>
    <circle cx="190.1" cy="49.4" r="0.63" fill="#EAF6FF"><animate attributeName="opacity" values="0.24;1;0.24" dur="2.79s" begin="1.27s" repeatCount="indefinite"/></circle>
    <circle cx="230.4" cy="28.4" r="1.02" fill="#EAF6FF"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.52s" begin="2.59s" repeatCount="indefinite"/></circle>
    <circle cx="63.0" cy="216.5" r="1.08" fill="#EAF6FF"><animate attributeName="opacity" values="0.16;1;0.16" dur="4.08s" begin="1.65s" repeatCount="indefinite"/></circle>
    <circle cx="233.8" cy="196.6" r="1.76" fill="#EAF6FF"><animate attributeName="opacity" values="0.18;1;0.18" dur="4.28s" begin="2.55s" repeatCount="indefinite"/></circle>
    <circle cx="97.4" cy="19.4" r="0.99" fill="#EAF6FF"><animate attributeName="opacity" values="0.31;1;0.31" dur="4.46s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="224.3" cy="233.0" r="1.22" fill="#EAF6FF"><animate attributeName="opacity" values="0.21;1;0.21" dur="3.66s" begin="0.46s" repeatCount="indefinite"/></circle>
    <circle cx="226.9" cy="138.1" r="1.2" fill="#EAF6FF"><animate attributeName="opacity" values="0.27;1;0.27" dur="3.74s" begin="0.17s" repeatCount="indefinite"/></circle>
    <circle cx="41.9" cy="225.1" r="0.6" fill="#EAF6FF"><animate attributeName="opacity" values="0.29;1;0.29" dur="2.06s" begin="1.79s" repeatCount="indefinite"/></circle>
    <circle cx="59.6" cy="33.3" r="1.66" fill="#EAF6FF"><animate attributeName="opacity" values="0.27;1;0.27" dur="2.24s" begin="1.78s" repeatCount="indefinite"/></circle>
    <circle cx="125.2" cy="219.1" r="0.77" fill="#EAF6FF"><animate attributeName="opacity" values="0.23;1;0.23" dur="3.65s" begin="0.72s" repeatCount="indefinite"/></circle>
    <circle cx="22.5" cy="110.5" r="1.8" fill="#EAF6FF"><animate attributeName="opacity" values="0.19;1;0.19" dur="4.49s" begin="0.22s" repeatCount="indefinite"/></circle>
    <circle cx="66.5" cy="218.8" r="1.65" fill="#EAF6FF"><animate attributeName="opacity" values="0.18;1;0.18" dur="4.14s" begin="1.11s" repeatCount="indefinite"/></circle>

    <!-- a slow shooting star crossing the field -->
    <g>
      <line x1="-10" y1="-10" x2="14" y2="4" stroke="#EAF6FF" stroke-width="1.5" stroke-linecap="round" opacity="0">
        <animate attributeName="opacity" values="0;0;0.9;0" keyTimes="0;0.55;0.62;0.78" dur="7s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate"
          values="0,0; 0,0; 200,90; 260,120" keyTimes="0;0.55;0.72;0.78" dur="7s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- ambient glow behind the scanner -->
    <circle cx="120" cy="120" r="88" fill="url(#glow)" opacity="0.3">
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- radar screen -->
    <circle cx="120" cy="120" r="86" fill="#04122A" opacity="0.55"/>
    <circle cx="120" cy="120" r="86" fill="none" stroke="#1F51FF" stroke-width="2" opacity="0.6"/>
    <circle cx="120" cy="120" r="64" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.35"/>
    <circle cx="120" cy="120" r="42" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.3"/>
    <circle cx="120" cy="120" r="20" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.25"/>

    <!-- crosshairs -->
    <line x1="120" y1="34" x2="120" y2="206" stroke="#1F51FF" stroke-width="1" opacity="0.25"/>
    <line x1="34" y1="120" x2="206" y2="120" stroke="#1F51FF" stroke-width="1" opacity="0.25"/>

    <!-- blips that flash as the sweep passes them -->
    <circle cx="152" cy="88" r="2.6" fill="#7DF9FF">
      <animate attributeName="opacity" values="0;0;1;0.2;0" keyTimes="0;0.2;0.24;0.4;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="158" r="2.2" fill="#7DF9FF">
      <animate attributeName="opacity" values="0;0;1;0.2;0" keyTimes="0;0.55;0.59;0.7;0.85" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="150" r="2" fill="#7DF9FF">
      <animate attributeName="opacity" values="0;0;1;0.2;0" keyTimes="0;0.82;0.86;0.95;1" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- rotating sweep beam with fading trail -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 120 120" to="360 120 120" dur="4s" repeatCount="indefinite"/>
      <path d="M 120 120 L 120 34 A 86 86 0 0 1 187.4 65.5 Z" fill="url(#sweep)"/>
      <line x1="120" y1="120" x2="120" y2="34" stroke="#7DF9FF" stroke-width="2" filter="url(#soft)"/>
    </g>

    <!-- center core -->
    <circle cx="120" cy="120" r="8" fill="#1F51FF" filter="url(#core)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="120" r="3.5" fill="#E0FFFF"/>

    <!-- subtle outer rim to frame the space capsule -->
    <circle cx="120" cy="120" r="117" fill="none" stroke="#1F51FF" stroke-width="2" opacity="0.4"/>
  </g>
</svg>
